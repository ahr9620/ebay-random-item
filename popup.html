<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eBay Random Item Finder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>eBay Random Item Finder</h1>
      <p class="subtitle">Discover random items within your budget</p>
    </div>

    <div class="form-section">
      <div class="input-group">
        <label for="budget">Your Budget (USD):</label>
        <div class="budget-input">
          <span class="currency">$</span>
          <input type="number" id="budget" placeholder="50.00" min="1" step="0.01">
        </div>
      </div>

      <button id="findItem" class="find-btn">Find Random Item</button>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Finding your random item...</p>
    </div>

    <div id="error" class="error hidden"></div>

    <div id="result" class="result hidden">
      <div class="item-card">
        <img id="itemImage" src="" alt="Item Image">
        <div class="item-details">
          <h2 id="itemTitle"></h2>
          <p class="item-price" id="itemPrice"></p>
          <p class="item-condition" id="itemCondition"></p>
          <a id="itemLink" href="" target="_blank" class="view-btn">View on eBay</a>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
